name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (Yarn PnP)
        run: corepack enable

      - name: Update npm (OIDC trusted publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies (zero-installs)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Lint (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            yarn lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Compute next version
        id: version
        run: yarn node scripts/release/compute-release.mjs

      - name: Bump package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"

      - name: Push version bump
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push version bump commit after npm publish succeeded." >&2
          exit 1

      - name: Tag release
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
