name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (Yarn PnP)
        run: corepack enable

      - name: Install dependencies (zero-installs)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Lint (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            yarn lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Compute next version
        id: version
        run: yarn node scripts/release/compute-release.mjs

      # package.json in the repo holds a placeholder. The real version only exists inside
      # this job, is used for the publish, and is never committed back to main.
      - name: Set package.json version for publish
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: yarn build

      # Exits 0 only once the version is live on npm; skips the upload when it already is.
      - name: Publish to npm
        run: yarn node scripts/release/publish.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin; skipping."
          else
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
          else
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
