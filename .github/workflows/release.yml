name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (Yarn PnP)
        run: corepack enable

      - name: Install dependencies (zero-installs)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Lint (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            yarn lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Compute next version
        id: version
        run: yarn node scripts/release/compute-release.mjs

      - name: Bump package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: yarn build

      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: yarn npm publish --access public --provenance

      - name: Already published
        if: steps.version.outputs.published == 'true'
        run: echo "v${{ steps.version.outputs.version }} is already on npm; skipping publish and completing commit, tag and release."

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already at v${{ steps.version.outputs.version }}; nothing to commit."
          else
            git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          fi
          # Only package.json is meant to ship. Discard anything else the install or
          # build touched so the rebase below never trips over a dirty tree.
          git reset --hard HEAD

      - name: Push version bump
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push version bump commit (npm publish already ran). Re-run this job: it will skip the publish and finish the push." >&2
          exit 1

      - name: Tag release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin; skipping."
          else
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
          else
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
