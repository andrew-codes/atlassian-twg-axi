nodeLinker: pnp
enableGlobalCache: false
pnpEnableEsmLoader: true

yarnPath: .yarn/releases/yarn-4.18.1.cjs

npmPublishRegistry: "https://registry.npmjs.org"

# Keep the committed zero-install cache identical on every platform we run on
# (macOS dev machines and ubuntu CI), so `yarn install` never rewrites it.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
